server {
    listen       80;
    listen       [::]:80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # O Coolify/Traefik termina o TLS na frente; aqui só precisamos do IP real.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json image/svg+xml font/woff2;

    # Assets com hash no nome: podem ser cacheados para sempre.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fotos dos serviços: mudam de vez em quando, cache moderado.
    location /services/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # HTML nunca é cacheado: é o que garante que uma nova publicação apareça.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    error_page 404 /404.html;

    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "SAMEORIGIN"     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
}
